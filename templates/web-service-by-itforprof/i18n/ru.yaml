? |
  The WHOIS master item has not received a fresh value for 3h
  (3× its default 1h delay). Causes, in order of likelihood:
  - the item is NOTSUPPORTED — read its error first (e.g. Invalid update
    interval "{$WEB_SERVICE.WHOIS.CHECK.INTERVAL}", which happens when the
    template gets unlinked from the host and its macros disappear);
  - the item is disabled — normal on hosts whose registry role is
    'duplicate' (WHOIS is polled once per apex domain by the owner host);
  - web_check.py is not executing on this host's monitored_by.
