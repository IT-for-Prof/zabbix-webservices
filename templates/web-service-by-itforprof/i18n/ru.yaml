? |
  The web scenario reports a failed step on two consecutive checks. Covers all hard failures:
  non-matching HTTP status code, missing required phrase, timeout,
  DNS resolution error, TLS handshake failure, or connection refused.
: |
  Шаг веб-сценария завершился с ошибкой две проверки подряд. Сюда входят все жёсткие сбои:
  неожиданный код HTTP, нет нужной фразы, таймаут,
  ошибка DNS, сбой TLS-рукопожатия или отказ в соединении.
