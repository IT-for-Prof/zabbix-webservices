? |-
  The server advertises HTTP/3 in its Alt-Svc header but the QUIC
  handshake from this proxy failed on 3 consecutive checks (~10-15 min).
  The site still answers over HTTP/2. Causes: UDP/443 dropped on the
  path, server-side QUIC stack misconfigured, or CDN regression. Checks
  that failed on DNS (error_code=dns_error) are not counted. Cross-check
  with the network-diagnostic items.
: |-
  Сервер объявляет HTTP/3 в заголовке Alt-Svc, но рукопожатие QUIC
  с этого прокси не прошло на трёх проверках подряд (около 10–15 мин).
  Сайт продолжает отвечать по HTTP/2. Причины: UDP/443 режется по пути,
  стек QUIC на сервере настроен неверно или регрессия CDN. Проверки,
  упавшие на DNS (error_code=dns_error), не учитываются. Сверьтесь
  с диагностическими элементами сети.
