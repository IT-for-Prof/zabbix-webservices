? |
  The live cert-master handshake just negotiated a deprecated TLS
  protocol (SSLv3 / TLSv1.0 / TLSv1.1). Distinct from Layer 5's
  "TLS weak protocol" LLD trigger which reflects what's *negotiable*
  at all; this one fires when our client is actually getting one of
  those on every poll, indicating a default-protocol misconfig.
: |
  Рукопожатие основной проверки сертификата согласовало устаревший
  протокол TLS (SSLv3, TLSv1.0 или TLSv1.1). Это другой триггер, чем LLD-триггер
  «слабый протокол TLS» слоя 5: тот показывает, что сервер допускает в принципе.
  Этот срабатывает, когда наш клиент получает такой протокол при каждом
  опросе, а значит, протокол по умолчанию настроен неверно.
