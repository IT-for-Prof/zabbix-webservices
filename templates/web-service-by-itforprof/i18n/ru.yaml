Web service by itforprof.com: Веб-сервис (itforprof.com)
? |
  Full-stack web-service monitoring template for Zabbix 7.0.
  Replaces legacy "Template Website metrics (itmicus.ru)" without
  abandoned PyPI deps. Six layers, single host, single template:

    1. HTTP availability  — native web scenario.
    2. TLS + certificate  — externalscript `web_check.py cert`.
    3. Domain WHOIS       — externalscript `web_check.py whois`
                            (apex-deduped via 24h FS cache).
    4. Network diagnostics — native simple checks (TCP).
    5. Deep TLS scan      — externalscript `web_check.py tls-scan`
                            + LLD for weak-protocol findings.
    6. HTTP/3 availability— externalscript `web_check.py http3`
                            (Alt-Svc detection + QUIC handshake, aioquic).

  All checks execute from the host's monitored_by (server or proxy),
  so request egress matches the rest of the host's monitoring.

  Design rationale and full taxonomy: docs/architecture.md.
  Validation matrix:               docs/validation.md.

  Author:  Konstantin Tyutyunnik / Константин Тютюнник
  Site:    https://itforprof.com
  Repo:    https://github.com/IT-for-Prof/zabbix-webservices
  Issues:  https://github.com/IT-for-Prof/zabbix-webservices/issues
  Credits: replaces the conceptually-similar Zabbix template
           `Template Website metrics (itmicus.ru)` by itmicus —
           https://github.com/itmicus/zabbix/tree/master/Template%20Web%20Site.
           No code was copied; macro names are kept compatible
           with existing host macros.
  License: MIT (c) 2025-2026 Konstantin Tyutyunnik
: |
  Шаблон Zabbix 7.0 для полного мониторинга веб-сервиса.
  Заменяет устаревший «Template Website metrics (itmicus.ru)» и работает
  без заброшенных пакетов PyPI. Шесть слоёв на одном хосте и в одном шаблоне:

    1. Доступность HTTP    — встроенный веб-сценарий.
    2. TLS и сертификат    — внешний скрипт `web_check.py cert`.
    3. WHOIS домена        — внешний скрипт `web_check.py whois`
                             (один запрос на регистрируемый домен, кеш на диске 24 ч).
    4. Сетевая диагностика — встроенные простые проверки (TCP).
    5. Глубокий скан TLS   — внешний скрипт `web_check.py tls-scan`
                             и LLD по слабым протоколам и шифрам.
    6. Доступность HTTP/3  — внешний скрипт `web_check.py http3`
                             (заголовок Alt-Svc и рукопожатие QUIC через aioquic).

  Все проверки выполняются там, где мониторится хост (сервер или прокси),
  поэтому запросы идут с того же адреса, что и остальной мониторинг хоста.

  Обоснование решений и полная классификация: docs/architecture.md.
  Матрица проверок:                            docs/validation.md.

  Автор:        Константин Тютюнник / Konstantin Tyutyunnik
  Сайт:         https://itforprof.com
  Репозиторий:  https://github.com/IT-for-Prof/zabbix-webservices
  Ошибки:       https://github.com/IT-for-Prof/zabbix-webservices/issues
  Предшественник: похожий по задаче шаблон Zabbix
                `Template Website metrics (itmicus.ru)` от itmicus —
                https://github.com/itmicus/zabbix/tree/master/Template%20Web%20Site.
                Код не копировался; имена макросов совместимы
                с макросами существующих хостов.
  Лицензия:     MIT (c) 2025-2026 Konstantin Tyutyunnik
Full URL to monitor, e.g. https://example.com/healthz. REQUIRED.: Полный URL для проверки, например https://example.com/healthz. Обязательный.
Substring/regex expected on the response body. Optional - leave empty to skip phrase check.: 'Подстрока или регулярное выражение, которые должны быть в теле ответа. Необязательный: пустое значение отключает проверку фразы.'
? PCRE flag prefix applied to {$WEB_SERVICE.PHRASE}. Default '(?i)' = case-insensitive. Set to empty string for case-sensitive matching, or '(?s)' for dotall, etc.
: Префикс флагов PCRE для {$WEB_SERVICE.PHRASE}. По умолчанию «(?i)» — без учёта регистра. Пустое значение — с учётом регистра, «(?s)» — точка совпадает и с переводом строки.
HTTP request timeout in seconds.: Таймаут HTTP-запроса в секундах.
HTTP status code(s) considered healthy. Comma-separated, ranges supported (e.g. "200,204,301-302").: Коды ответа HTTP, которые считаются нормальными. Через запятую, можно указывать диапазоны, например «200,204,301-302».
User-Agent header for the web scenario.: Заголовок User-Agent для веб-сценария.
How often the web scenario runs.: Интервал запуска веб-сценария.
How often the TLS-cert master item runs.: Интервал основного элемента проверки сертификата.
How often the WHOIS master item runs (mostly cache hits).: Интервал основного элемента WHOIS (обычно ответ берётся из кеша).
WHOIS cache TTL in seconds (passed to web_check.py whois --ttl).: Время жизни кеша WHOIS в секундах (передаётся в web_check.py whois --ttl).
How often the deep TLS scan runs.: Интервал глубокого скана TLS.
How often the HTTP/3 master item runs.: Интервал основного элемента HTTP/3.
? QUIC handshake WARNING threshold in milliseconds. Default 1000ms tolerates intercontinental UDP+QUIC handshake. Drop to 250 for LAN.
: Порог предупреждения для рукопожатия QUIC в миллисекундах. 1000 мс по умолчанию учитывают межконтинентальные задержки. Для локальной сети — 250.
How often diagnostic simple-check items run.: Интервал диагностических простых проверок.
? Avg HTTP response time over 10m (seconds) above which a WARNING trigger fires. Default 10s tolerates intercontinental traffic; drop to 5 for regional sites.
: Среднее время ответа HTTP за 10 мин в секундах, выше которого срабатывает предупреждение. 10 с по умолчанию учитывают межконтинентальные задержки, для региональных сайтов — 5.
Period of no-data before the No-data trigger fires (web scenario item).: Сколько времени веб-сценарий может не присылать данных, прежде чем сработает триггер «нет данных».
Cert expiry INFO trigger threshold (days).: Порог триггера уровня «Информация» по сроку сертификата, дни.
Cert expiry WARNING trigger threshold (days).: Порог триггера уровня «Предупреждение» по сроку сертификата, дни.
Cert expiry critical (AVERAGE) trigger threshold (days).: Критический порог по сроку сертификата (уровень «Средняя»), дни.
? Late-rotation threshold (days). If a cert rotation is detected (fingerprint changed) while the OUTGOING cert had fewer than this many days left, raise the WARNING "rotated late" trigger — a near-miss/hygiene signal, not an outage (a fresh cert is already installed by the time it fires). The trigger reads the pre-rotation window (max over the 2h ending 15m ago), never the freshly installed cert. Default 3 keeps it quiet on provider-managed hosts whose renewal cadence you do not control; raise it to flag earlier on hosts where you own the renewal automation.
: 'Порог поздней замены сертификата, дни. Если сертификат заменён (сменился отпечаток), а у прежнего оставалось меньше этого числа дней, срабатывает предупреждение «сертификат заменён поздно». Это сигнал о малом запасе. Аварии нет: к моменту срабатывания новый сертификат уже установлен. Триггер смотрит на окно до замены (максимум за 2 ч, закончившиеся 15 мин назад) и не видит новый сертификат. Значение 3 по умолчанию не шумит на хостах, где продлением управляет провайдер. Увеличьте его там, где автоматизация продления ваша, чтобы узнавать раньше.'
Minimum acceptable RSA key size (bits).: Минимальная длина ключа RSA, бит.
Minimum acceptable ECDSA key size (bits).: Минимальная длина ключа ECDSA, бит.
Domain expires within N days WARNING trigger threshold.: 'Порог триггера уровня «Предупреждение»: домен истекает через N дней.'
Domain expires within N days AVERAGE trigger threshold.: 'Порог триггера уровня «Средняя»: домен истекает через N дней.'
Domain expires within N days critical (AVERAGE) trigger threshold.: 'Критический порог по сроку домена (уровень «Средняя»): домен истекает через N дней.'
? Host or IP for diagnostic simple checks (net.dns.record / net.tcp.service.perf). Defaults to {$WEB_SERVICE.URL} host; override per host if needed.
: Хост или IP для диагностических простых проверок (net.dns.record, net.tcp.service.perf). По умолчанию — хост из {$WEB_SERVICE.URL}, при необходимости переопределяется на хосте.
? net.tcp.service.perf WARNING threshold in seconds. Default 3s tolerates intercontinental TCP+TLS handshake (~300-800ms typical) plus headroom. Drop to 1 for LAN/regional monitoring.
: Порог предупреждения для net.tcp.service.perf в секундах. 3 с по умолчанию покрывают межконтинентальное соединение TCP и TLS (обычно 300–800 мс) с запасом. Для локальной сети и проверок внутри региона — 1.
