'Cert: SHA-256 fingerprint': 'Сертификат: отпечаток SHA-256'
Cert rotated: Сертификат заменён
? |-
  The SHA-256 fingerprint changed since the last poll — a new cert was deployed. Informational; usually expected (Let's Encrypt renews every ~60 days).

  A check outage cannot trigger this: the item discards the error-envelope fingerprint ("") via MATCHES_REGEX, so change() only ever sees a genuine <real>→<real> rotation — never a ""→real recovery transition.
: |-
  Отпечаток SHA-256 изменился с прошлого опроса: установлен новый сертификат. Это информационное событие и обычно ожидаемое (Let's Encrypt продлевает сертификат примерно раз в 60 дней).

  Сбой проверки это событие не вызывает. Элемент отбрасывает пустой отпечаток ("") из ответа с ошибкой шагом MATCHES_REGEX, поэтому change() видит только настоящую замену <прежний>→<новый> и никогда — восстановление ""→<настоящий>.
TLS cert rotated (new fingerprint {ITEM.LASTVALUE1}) — {$WEB_SERVICE.URL} on {HOST.HOST}: Сертификат TLS заменён (новый отпечаток {ITEM.LASTVALUE1}) — {$WEB_SERVICE.URL} на {HOST.HOST}
Cert rotated unexpectedly (was about to expire): Сертификат заменён поздно (почти истёк)
? |-
  The cert fingerprint changed (rotation) while the OUTGOING cert was already inside the {$WEB_SERVICE.CERT.ROTATE_MIN_DAYS}-day window — the renewal cut it close. This is a retrospective near-miss / hygiene signal, NOT an active outage: a fresh cert is already installed by the time this fires, and the genuine "cert actually lapses" risk is covered by the separate cert-expiry triggers. WARNING (not HIGH) so it stays a dashboard signal without escalating/ticketing. On hosts where you own the renewal automation, a late rotation still means the automation is cutting it dangerously close — investigate. On provider-managed hosts you do not control the cadence; ignore or tune {$WEB_SERVICE.CERT.ROTATE_MIN_DAYS}.

  Reads max(days_to_expire) over the 2h ending 15m ago, i.e. the OLD cert's remaining days just before rotation — NOT last(), which on a dependent item already reflects the new cert at the moment the fingerprint changes. max() over the window also rides out transient error-envelope dips (e.g. -1 / 0) from a single failed poll.

  A check OUTAGE cannot false-fire this: the fingerprint item discards the envelope "" (MATCHES_REGEX), so a ""→real recovery is not a change(). And because the "" is dropped rather than stored, a genuinely late rotation that happened to span a failed poll (<old>→""→<new>) still registers as <old>→<new> and fires — which an in-trigger last(,#2) guard would have wrongly suppressed.
: |-
  Отпечаток сертификата изменился (замена), когда у прежнего сертификата оставалось меньше {$WEB_SERVICE.CERT.ROTATE_MIN_DAYS} дн.: продление прошло впритык. Это сигнал о малом запасе. Аварии нет: к моменту срабатывания новый сертификат уже установлен, а за риск настоящего истечения отвечают отдельные триггеры срока. Уровень «Предупреждение»: событие остаётся на панели и не уходит в эскалацию и тикеты. Если автоматизация продления ваша, поздняя замена значит, что она работает опасно близко к сроку, — разберитесь. Если продлением управляет провайдер, график вы не контролируете: не обращайте внимания на событие или настройте {$WEB_SERVICE.CERT.ROTATE_MIN_DAYS}.

  Триггер читает max(days_to_expire) за 2 ч, закончившиеся 15 мин назад, то есть остаток дней прежнего сертификата перед заменой. last() для этого не подходит: у зависимого элемента в момент смены отпечатка он уже показывает новый сертификат. max() по окну заодно не замечает кратковременных провалов (например, -1 или 0) от одного неудачного опроса.

  Сбой проверки не вызывает ложного срабатывания. Элемент отпечатка отбрасывает пустое значение "" из ответа с ошибкой (MATCHES_REGEX), поэтому восстановление ""→<настоящий> для change() изменением не считается. А раз "" отбрасывается и не сохраняется, поздняя замена, пришедшаяся на неудачный опрос (<прежний>→""→<новый>), всё равно видна как <прежний>→<новый> и вызывает срабатывание. Проверка last(,#2) внутри триггера ошибочно подавила бы такой случай.
