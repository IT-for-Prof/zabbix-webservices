The TLS certificate will expire within the AVERAGE threshold.: Сертификат TLS истечёт в пределах порога уровня «Средняя».
TLS cert expires in {ITEM.VALUE1} (< {$WEB_SERVICE.CERT.NOTICE_DAYS}d) — {$WEB_SERVICE.URL} on {HOST.HOST}: Сертификат TLS истекает через {ITEM.VALUE1} (< {$WEB_SERVICE.CERT.NOTICE_DAYS} дн.) — {$WEB_SERVICE.URL} на {HOST.HOST}
Certificate renewal is due within the warning threshold.: Сертификат нужно продлить в пределах порога предупреждения.
TLS cert expires in {ITEM.VALUE1} (< {$WEB_SERVICE.CERT.WARN_DAYS}d) — {$WEB_SERVICE.URL} on {HOST.HOST}: Сертификат TLS истекает через {ITEM.VALUE1} (< {$WEB_SERVICE.CERT.WARN_DAYS} дн.) — {$WEB_SERVICE.URL} на {HOST.HOST}
TLS cert rotated (new fingerprint {ITEM.VALUE1}) — {$WEB_SERVICE.URL} on {HOST.HOST}: Сертификат TLS заменён (новый отпечаток {ITEM.VALUE1}) — {$WEB_SERVICE.URL} на {HOST.HOST}
'TLS cert signed with weak algorithm: {ITEM.VALUE1} — {$WEB_SERVICE.URL} on {HOST.HOST}': 'Сертификат TLS подписан слабым алгоритмом: {ITEM.VALUE1} — {$WEB_SERVICE.URL} на {HOST.HOST}'
The leaf certificate is signed with SHA-1 or MD5; TLS clients reject both algorithms.: Конечный сертификат подписан SHA-1 или MD5. Клиенты TLS отвергают оба алгоритма.
'TLS cert weak key: {ITEM.VALUE1} {ITEM.VALUE2} bits — {$WEB_SERVICE.URL} on {HOST.HOST}': 'Слабый ключ сертификата TLS: {ITEM.VALUE1} {ITEM.VALUE2} бит — {$WEB_SERVICE.URL} на {HOST.HOST}'
TLS cert chain {ITEM.VALUE1} — {$WEB_SERVICE.URL} on {HOST.HOST}: 'Цепочка сертификата TLS: {ITEM.VALUE1} — {$WEB_SERVICE.URL} на {HOST.HOST}'
'Live TLS negotiated weak protocol: {ITEM.VALUE1} — {$WEB_SERVICE.URL} on {HOST.HOST}': 'Согласован слабый протокол TLS: {ITEM.VALUE1} — {$WEB_SERVICE.URL} на {HOST.HOST}'
TLS scan does not finish within its time limit: Скан TLS не укладывается в лимит времени
'web_check.py tls-scan: no result within 25s on 2 runs in a row — {$WEB_SERVICE.URL} on {HOST.HOST}': 'web_check.py tls-scan: нет результата за 25 с два запуска подряд — {$WEB_SERVICE.URL} на {HOST.HOST}'
? |
  The last two daily TLS scans returned error_code=tls_scan_timeout: the
  server answers too slowly for the protocol and weak-cipher probes to
  finish within 25s (Zabbix stops external checks at 30s). Supported
  protocols and weak-cipher findings are not updated meanwhile; the LLD
  rule keeps the findings it already has. Suppressed while TCP 443 to the
  host fails, which already reports an unreachable target.
: |
  Два последних ежедневных скана TLS вернули error_code=tls_scan_timeout.
  Сервер отвечает слишком медленно, и пробы протоколов и слабых шифров
  не успевают за 25 с (Zabbix останавливает внешние проверки на 30 с).
  Поддерживаемые протоколы и находки по слабым шифрам пока не обновляются,
  правило LLD сохраняет уже найденное. Триггер молчит, пока не проходит
  соединение TCP 443: о недоступной цели уже сообщает другой триггер.

Cert check failing on 3 consecutive checks: Проверка сертификата не работает 3 раза подряд
'web_check.py cert failed on 3 consecutive checks — {$WEB_SERVICE.URL} on {HOST.HOST}': 'web_check.py cert: ошибка 3 раза подряд — {$WEB_SERVICE.URL} на {HOST.HOST}'
Three consecutive certificate checks returned ok=false. Recovers on the first successful check or when the master item stops receiving data; the separate no-data trigger covers missing output.: Три проверки сертификата подряд вернули ok=false. Событие закрывается после первой успешной проверки или при прекращении поступления данных в основной элемент; отсутствие данных отслеживает отдельный триггер.
