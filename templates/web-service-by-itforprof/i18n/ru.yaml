Web service by itforprof.com - Certificate-TLS: Веб-сервис (itforprof.com) — сертификат и TLS
? |-
  Certificate and live TLS monitoring profile for TLS endpoints checked with an https://host[:port] URL.

  Includes the `web_check.py cert` master external item, certificate metadata,
  expiry and rotation triggers, chain/hostname validation, and live negotiated
  TLS protocol, cipher, and handshake time. The URL may include a non-standard
  TLS port, for example `https://sql.example.com:1433`.

  Checks execute from the host's monitored_by (server or proxy). The host running
  this profile must be able to reach the endpoint and trust its CA chain when
  chain validation is required.
: |-
  Профиль мониторинга сертификата и текущего TLS для конечных точек TLS, которые проверяются по URL вида https://host[:port].

  Включает основной внешний элемент `web_check.py cert`, метаданные сертификата,
  триггеры срока и замены, проверку цепочки и имени хоста, а также текущие
  протокол TLS, шифр и время рукопожатия. В URL можно указать нестандартный
  порт TLS, например `https://sql.example.com:1433`.

  Проверки выполняются там, где мониторится хост (сервер или прокси). У хоста с этим
  профилем должен быть доступ к конечной точке, а если нужна проверка цепочки,
  он должен доверять её цепочке УЦ.
TLS endpoint URL, including a non-standard port when needed, e.g. https://sql.example.com:1433. REQUIRED.: URL конечной точки TLS, при необходимости с нестандартным портом, например https://sql.example.com:1433. Обязательный.
How often the TLS certificate probe runs. Override per host.: Интервал проверки сертификата TLS. Переопределяется на хосте.
No-data period for the certificate master item. Keep at least three times the check interval.: Период без данных для основного элемента сертификата. Не меньше трёх интервалов проверки.
Cert expiry WARNING threshold in days. Override per host.: Порог уровня «Предупреждение» по сроку сертификата, дни. Переопределяется на хосте.
Cert expiry AVERAGE threshold in days. Override per host.: Порог уровня «Средняя» по сроку сертификата, дни. Переопределяется на хосте.
Cert expiry critical (AVERAGE) threshold in days. Override per host.: Критический порог по сроку сертификата (уровень «Средняя»), дни. Переопределяется на хосте.
Late-rotation threshold in days. Override per host.: Порог поздней замены сертификата, дни. Переопределяется на хосте.
Minimum acceptable RSA key size in bits. Override per host.: Минимальная длина ключа RSA, бит. Переопределяется на хосте.
Minimum acceptable ECDSA key size in bits. Override per host.: Минимальная длина ключа ECDSA, бит. Переопределяется на хосте.
'web_check.py cert: no fresh value in {$WEB_SERVICE.CERT.NODATA.PERIOD} — {$WEB_SERVICE.URL} on {HOST.HOST}': 'web_check.py cert: нет свежего значения {$WEB_SERVICE.CERT.NODATA.PERIOD} — {$WEB_SERVICE.URL} на {HOST.HOST}'
no value for {$WEB_SERVICE.CERT.NODATA.PERIOD} — item NOTSUPPORTED, disabled, or script not running: нет значения {$WEB_SERVICE.CERT.NODATA.PERIOD} — элемент не поддерживается, отключён или скрипт не запускается
? |
  The cert master item has not received a fresh value for {$WEB_SERVICE.CERT.NODATA.PERIOD}
  (3× its default delay). Causes, in order of likelihood:
  - the item is NOTSUPPORTED — read its error first (e.g. Invalid update
    interval "{$WEB_SERVICE.CERT.CHECK.INTERVAL}", which happens when the
    template gets unlinked from the host and its macros disappear);
  - the item is disabled;
  - web_check.py is not executing: check that
    /usr/lib/zabbix/externalscripts/web_check.py exists and is executable
    on this host's monitored_by, and that the venv at /opt/web_check/venv
    is intact.
: |
  Основной элемент сертификата не получал свежего значения {$WEB_SERVICE.CERT.NODATA.PERIOD}
  (втрое дольше интервала по умолчанию). Причины по убыванию вероятности:
  - элемент не поддерживается — сначала прочитайте его ошибку (например,
    Invalid update interval "{$WEB_SERVICE.CERT.CHECK.INTERVAL}": так бывает,
    когда шаблон отвязали от хоста и его макросы пропали);
  - элемент отключён;
  - web_check.py не запускается: проверьте, что
    /usr/lib/zabbix/externalscripts/web_check.py есть и исполняемый
    там, где мониторится хост, и что venv в /opt/web_check/venv
    в порядке.
