zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: bd327ca2dab24c4aa6ba757655aa052f
    name: Templates/Applications
  templates:
  - uuid: acd02a9a93cc46858b4c8bd2e94eb50d
    template: Web service by itforprof.com - Certificate-TLS
    name: Web service by itforprof.com - Certificate-TLS
    description: 'Certificate and live TLS monitoring profile for TLS endpoints checked with
      an https://host[:port] URL.


      Includes the `web_check.py cert` master external item, certificate metadata,

      expiry and rotation triggers, chain/hostname validation, and live negotiated

      TLS protocol, cipher, and handshake time. The URL may include a non-standard

      TLS port, for example `https://sql.example.com:1433`.


      Checks execute from the host''s monitored_by (server or proxy). The host running

      this profile must be able to reach the endpoint and trust its CA chain when

      chain validation is required.'
    vendor:
      name: itforprof.com
      version: 7.0-1.1.0
    groups:
    - name: Templates/Applications
    macros:
    - macro: '{$WEB_SERVICE.URL}'
      description: TLS endpoint URL, including a non-standard port when needed, e.g. https://sql.example.com:1433. REQUIRED.
    - macro: '{$WEB_SERVICE.CERT.CHECK.INTERVAL}'
      value: 5m
      description: How often the TLS certificate probe runs. Override per host.
    - macro: '{$WEB_SERVICE.CERT.NODATA.PERIOD}'
      value: 15m
      description: No-data period for the certificate master item. Keep at least three times the check interval.
    - macro: '{$WEB_SERVICE.CERT.WARN_DAYS}'
      value: '90'
      description: Cert expiry WARNING threshold in days. Override per host.
    - macro: '{$WEB_SERVICE.CERT.NOTICE_DAYS}'
      value: '30'
      description: Cert expiry AVERAGE threshold in days. Override per host.
    - macro: '{$WEB_SERVICE.CERT.CRIT_DAYS}'
      value: '7'
      description: Cert expiry High threshold in days. Override per host.
    - macro: '{$WEB_SERVICE.CERT.ROTATE_MIN_DAYS}'
      value: '3'
      description: Late-rotation threshold in days. Override per host.
    - macro: '{$WEB_SERVICE.CERT.MIN_KEY_RSA}'
      value: '2048'
      description: Minimum acceptable RSA key size in bits. Override per host.
    - macro: '{$WEB_SERVICE.CERT.MIN_KEY_ECDSA}'
      value: '256'
      description: Minimum acceptable ECDSA key size in bits. Override per host.
    tags:
    - tag: class
      value: tls-service
    items:
    - uuid: 260f659e035e4b20a9b4cafdbddf7b3b
      name: 'Cert: probe (master JSON)'
      type: EXTERNAL
      key: web_check.py["cert","{$WEB_SERVICE.URL}"]
      delay: '{$WEB_SERVICE.CERT.CHECK.INTERVAL}'
      history: 7d
      trends: '0'
      value_type: TEXT
      description: 'Runs `web_check.py cert <url>` on the host''s monitored_by.

        Output is a JSON object consumed by the dependent items below

        (subject/issuer/SANs/fingerprint/days-to-expire/chain_status/...).

        Always exits 0; failures encode as {"ok": false, "error_code": ...}.

        '
      tags:
      - tag: scope
        value: tls
      - tag: layer
        value: '2'
      triggers:
      - uuid: b8e8f02b25b84fc6867f320afe7141a1
        expression: nodata(/Web service by itforprof.com - Certificate-TLS/web_check.py["cert","{$WEB_SERVICE.URL}"],{$WEB_SERVICE.CERT.NODATA.PERIOD})=1
        name: Cert externalscript no data received
        event_name: 'web_check.py cert: no fresh value in {$WEB_SERVICE.CERT.NODATA.PERIOD} — {$WEB_SERVICE.URL} on {HOST.HOST}'
        opdata: no value for {$WEB_SERVICE.CERT.NODATA.PERIOD} — item NOTSUPPORTED, disabled, or script not running
        priority: AVERAGE
        manual_close: 'YES'
        description: "The cert master item has not received a fresh value for {$WEB_SERVICE.CERT.NODATA.PERIOD}\n(3× its default delay). Causes, in order\
          \ of likelihood:\n- the item is NOTSUPPORTED — read its error first (e.g. Invalid update\n  interval \"{$WEB_SERVICE.CERT.CHECK.INTERVAL}\"\
          , which happens when the\n  template gets unlinked from the host and its macros disappear);\n- the item is disabled;\n\
          - web_check.py is not executing: check that\n  /usr/lib/zabbix/externalscripts/web_check.py exists and is executable\n\
          \  on this host's monitored_by, and that the venv at /opt/web_check/venv\n  is intact.\n"
        tags:
        - tag: scope
          value: data-collection
        - tag: url
          value: '{$WEB_SERVICE.URL}'
    - uuid: 413e98f10b404626b8e7e2b043c6b2da
      name: 'Cert: days to expire'
      type: DEPENDENT
      key: web_check.cert.days_to_expire
      value_type: FLOAT
      units: d
      master_item:
        key: web_check.py["cert","{$WEB_SERVICE.URL}"]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.cert.days_to_expire
        error_handler: CUSTOM_ERROR
        error_handler_params: 'No cert data: web_check.py cert returned error envelope (see master item JSON).'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      tags:
      - tag: scope
        value: tls
      triggers:
      - uuid: 91bfdd68386343d2824bbb564a919e01
        expression: last(/Web service by itforprof.com - Certificate-TLS/web_check.cert.days_to_expire)<0
        name: Cert expired
        event_name: TLS cert expired ({ITEM.VALUE1} past not_after) — {$WEB_SERVICE.URL} on {HOST.HOST}
        priority: HIGH
        manual_close: 'YES'
        description: The current TLS certificate is past its not_after date.
        tags:
        - tag: scope
          value: tls
        - tag: url
          value: '{$WEB_SERVICE.URL}'
        dependencies:
        - name: Cert check failing
          expression: last(/Web service by itforprof.com - Certificate-TLS/web_check.cert.ok)=0
      - uuid: 14097279408546c1be83706efc00fa46
        expression: 'last(/Web service by itforprof.com - Certificate-TLS/web_check.cert.days_to_expire)>=0 and

          last(/Web service by itforprof.com - Certificate-TLS/web_check.cert.days_to_expire)<{$WEB_SERVICE.CERT.CRIT_DAYS}

          '
        name: Cert expires within {$WEB_SERVICE.CERT.CRIT_DAYS} days
        priority: HIGH
        manual_close: 'YES'
        description: The TLS certificate will expire soon. Rotate now.
        dependencies:
        - name: Cert expired
          expression: last(/Web service by itforprof.com - Certificate-TLS/web_check.cert.days_to_expire)<0
        tags:
        - tag: scope
          value: tls
        - tag: url
          value: '{$WEB_SERVICE.URL}'
        event_name: TLS cert expires in {ITEM.VALUE1} (< {$WEB_SERVICE.CERT.CRIT_DAYS}d) — {$WEB_SERVICE.URL} on {HOST.HOST}
      - uuid: 25166d4e203c4903b14fb962a33b3f36
        expression: 'last(/Web service by itforprof.com - Certificate-TLS/web_check.cert.days_to_expire)>={$WEB_SERVICE.CERT.CRIT_DAYS}
          and

          last(/Web service by itforprof.com - Certificate-TLS/web_check.cert.days_to_expire)<{$WEB_SERVICE.CERT.NOTICE_DAYS}

          '
        name: Cert expires within {$WEB_SERVICE.CERT.NOTICE_DAYS} days
        priority: AVERAGE
        manual_close: 'YES'
        description: The TLS certificate will expire within the AVERAGE threshold.
        dependencies:
        - name: Cert expires within {$WEB_SERVICE.CERT.CRIT_DAYS} days
          expression: 'last(/Web service by itforprof.com - Certificate-TLS/web_check.cert.days_to_expire)>=0 and

            last(/Web service by itforprof.com - Certificate-TLS/web_check.cert.days_to_expire)<{$WEB_SERVICE.CERT.CRIT_DAYS}

            '
        tags:
        - tag: scope
          value: tls
        - tag: url
          value: '{$WEB_SERVICE.URL}'
        event_name: TLS cert expires in {ITEM.VALUE1} (< {$WEB_SERVICE.CERT.NOTICE_DAYS}d) — {$WEB_SERVICE.URL} on {HOST.HOST}
      - uuid: 1eb2de1b4ea64050a514ac0b5a36fda3
        expression: 'last(/Web service by itforprof.com - Certificate-TLS/web_check.cert.days_to_expire)>={$WEB_SERVICE.CERT.NOTICE_DAYS}
          and

          last(/Web service by itforprof.com - Certificate-TLS/web_check.cert.days_to_expire)<{$WEB_SERVICE.CERT.WARN_DAYS}

          '
        name: Cert expires within {$WEB_SERVICE.CERT.WARN_DAYS} days
        priority: WARNING
        manual_close: 'YES'
        description: Certificate renewal is due within the warning threshold.
        dependencies:
        - name: Cert expires within {$WEB_SERVICE.CERT.NOTICE_DAYS} days
          expression: 'last(/Web service by itforprof.com - Certificate-TLS/web_check.cert.days_to_expire)>={$WEB_SERVICE.CERT.CRIT_DAYS}
            and

            last(/Web service by itforprof.com - Certificate-TLS/web_check.cert.days_to_expire)<{$WEB_SERVICE.CERT.NOTICE_DAYS}

            '
        tags:
        - tag: scope
          value: tls
        - tag: url
          value: '{$WEB_SERVICE.URL}'
        event_name: TLS cert expires in {ITEM.VALUE1} (< {$WEB_SERVICE.CERT.WARN_DAYS}d) — {$WEB_SERVICE.URL} on {HOST.HOST}
    - uuid: 18a1049729d04d69b8728fb6765ae2c8
      name: 'Cert: not_after'
      type: DEPENDENT
      key: web_check.cert.not_after
      value_type: CHAR
      master_item:
        key: web_check.py["cert","{$WEB_SERVICE.URL}"]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.cert.not_after
        error_handler: CUSTOM_ERROR
        error_handler_params: 'No cert data: web_check.py cert returned error envelope (see master item JSON).'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: scope
        value: tls
    - uuid: 837887807b5e466bb12cdf0e15a3d5f3
      name: 'Cert: subject CN'
      type: DEPENDENT
      key: web_check.cert.subject_cn
      value_type: CHAR
      master_item:
        key: web_check.py["cert","{$WEB_SERVICE.URL}"]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.cert.subject_cn
        error_handler: CUSTOM_ERROR
        error_handler_params: 'No cert data: web_check.py cert returned error envelope (see master item JSON).'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: scope
        value: tls
    - uuid: 1c77baffd63e4675955b05130f762867
      name: 'Cert: issuer CN'
      type: DEPENDENT
      key: web_check.cert.issuer_cn
      value_type: CHAR
      master_item:
        key: web_check.py["cert","{$WEB_SERVICE.URL}"]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.cert.issuer_cn
        error_handler: CUSTOM_ERROR
        error_handler_params: 'No cert data: web_check.py cert returned error envelope (see master item JSON).'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: scope
        value: tls
    - uuid: eafa772f8cf841d1a2070735bc553232
      name: 'Cert: issuer organization'
      type: DEPENDENT
      key: web_check.cert.issuer_org
      value_type: CHAR
      master_item:
        key: web_check.py["cert","{$WEB_SERVICE.URL}"]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.cert.issuer_org
        error_handler: CUSTOM_ERROR
        error_handler_params: 'No cert data: web_check.py cert returned error envelope (see master item JSON).'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: scope
        value: tls
    - uuid: 282276208a0e452fbdc624666ae57095
      name: 'Cert: serial'
      type: DEPENDENT
      key: web_check.cert.serial
      value_type: CHAR
      master_item:
        key: web_check.py["cert","{$WEB_SERVICE.URL}"]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.cert.serial
        error_handler: CUSTOM_ERROR
        error_handler_params: 'No cert data: web_check.py cert returned error envelope (see master item JSON).'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: scope
        value: tls
    - uuid: 708c060030004d8fb12d39e4d9aba3a2
      name: 'Cert: SANs'
      type: DEPENDENT
      key: web_check.cert.sans
      value_type: TEXT
      master_item:
        key: web_check.py["cert","{$WEB_SERVICE.URL}"]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.cert.sans
        error_handler: CUSTOM_ERROR
        error_handler_params: 'No cert data: web_check.py cert returned error envelope (see master item JSON).'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: scope
        value: tls
    - uuid: 50b8a5d3c44a45fb8bf0eee026e38cbe
      name: 'Cert: SHA-256 fingerprint'
      type: DEPENDENT
      key: web_check.cert.fingerprint_sha256
      value_type: CHAR
      master_item:
        key: web_check.py["cert","{$WEB_SERVICE.URL}"]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.cert.fingerprint_sha256
        error_handler: CUSTOM_ERROR
        error_handler_params: 'No cert data: web_check.py cert returned error envelope (see master item JSON).'
      - type: MATCHES_REGEX
        parameters:
        - ^[0-9A-Fa-f]{64}$
        error_handler: DISCARD_VALUE
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: scope
        value: tls
      triggers:
      - uuid: 63c99bfe8c3241d297d02e1210373db6
        expression: change(/Web service by itforprof.com - Certificate-TLS/web_check.cert.fingerprint_sha256)=1
        name: Cert rotated
        priority: INFO
        description: 'The SHA-256 fingerprint changed since the last poll — a new cert was deployed. Informational; usually
          expected (Let''s Encrypt renews every ~60 days).


          A check outage cannot trigger this: the item discards the error-envelope fingerprint ("") via MATCHES_REGEX, so
          change() only ever sees a genuine <real>→<real> rotation — never a ""→real recovery transition.'
        tags:
        - tag: scope
          value: tls
        - tag: url
          value: '{$WEB_SERVICE.URL}'
        dependencies:
        - name: Cert check failing
          expression: last(/Web service by itforprof.com - Certificate-TLS/web_check.cert.ok)=0
        event_name: TLS cert rotated (new fingerprint {ITEM.VALUE1}) — {$WEB_SERVICE.URL} on {HOST.HOST}
        manual_close: 'YES'
      - uuid: 045e01aa0eef460b81a580371229c492
        expression: change(/Web service by itforprof.com - Certificate-TLS/web_check.cert.fingerprint_sha256)=1 and max(/Web
          service by itforprof.com - Certificate-TLS/web_check.cert.days_to_expire,2h:now-15m)<{$WEB_SERVICE.CERT.ROTATE_MIN_DAYS}
        name: Cert rotated unexpectedly (was about to expire)
        priority: WARNING
        description: 'The cert fingerprint changed (rotation) while the OUTGOING cert was already inside the {$WEB_SERVICE.CERT.ROTATE_MIN_DAYS}-day
          window — the renewal cut it close. This is a retrospective near-miss / hygiene signal, NOT an active outage: a fresh
          cert is already installed by the time this fires, and the genuine "cert actually lapses" risk is covered by the
          separate cert-expiry triggers. WARNING (not HIGH) so it stays a dashboard signal without escalating/ticketing. On
          hosts where you own the renewal automation, a late rotation still means the automation is cutting it dangerously
          close — investigate. On provider-managed hosts you do not control the cadence; ignore or tune {$WEB_SERVICE.CERT.ROTATE_MIN_DAYS}.


          Reads max(days_to_expire) over the 2h ending 15m ago, i.e. the OLD cert''s remaining days just before rotation —
          NOT last(), which on a dependent item already reflects the new cert at the moment the fingerprint changes. max()
          over the window also rides out transient error-envelope dips (e.g. -1 / 0) from a single failed poll.


          A check OUTAGE cannot false-fire this: the fingerprint item discards the envelope "" (MATCHES_REGEX), so a ""→real
          recovery is not a change(). And because the "" is dropped rather than stored, a genuinely late rotation that happened
          to span a failed poll (<old>→""→<new>) still registers as <old>→<new> and fires — which an in-trigger last(,#2)
          guard would have wrongly suppressed.'
        tags:
        - tag: scope
          value: tls
        - tag: url
          value: '{$WEB_SERVICE.URL}'
        dependencies:
        - name: Cert check failing
          expression: last(/Web service by itforprof.com - Certificate-TLS/web_check.cert.ok)=0
        event_name: 'TLS cert rotated late: outgoing cert had <{$WEB_SERVICE.CERT.ROTATE_MIN_DAYS}d left — {$WEB_SERVICE.URL}
          on {HOST.HOST}'
        manual_close: 'YES'
    - uuid: 5119c4b22aee4c94ae615b0f6b4652d9
      name: 'Cert: signature algorithm'
      type: DEPENDENT
      key: web_check.cert.signature_algorithm
      value_type: CHAR
      master_item:
        key: web_check.py["cert","{$WEB_SERVICE.URL}"]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.cert.signature_algorithm
        error_handler: CUSTOM_ERROR
        error_handler_params: 'No cert data: web_check.py cert returned error envelope (see master item JSON).'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: scope
        value: tls
      triggers:
      - uuid: c4d0082df0fd45e1a5a45e81e16fedf9
        expression: find(/Web service by itforprof.com - Certificate-TLS/web_check.cert.signature_algorithm,,"regexp","(?i)(sha1|md5)")=1
        name: Cert weak signature algorithm
        event_name: 'TLS cert signed with weak algorithm: {ITEM.VALUE1} — {$WEB_SERVICE.URL} on {HOST.HOST}'
        priority: WARNING
        manual_close: 'YES'
        description: The leaf certificate is signed with SHA-1 or MD5; TLS clients reject both algorithms.
        tags:
        - tag: scope
          value: tls
        - tag: url
          value: '{$WEB_SERVICE.URL}'
        dependencies:
        - name: Cert check failing
          expression: last(/Web service by itforprof.com - Certificate-TLS/web_check.cert.ok)=0
    - uuid: 38604af17e7d4e1ca0571d08a3a5bd0c
      name: 'Cert: public key algorithm'
      type: DEPENDENT
      key: web_check.cert.public_key_algorithm
      value_type: CHAR
      master_item:
        key: web_check.py["cert","{$WEB_SERVICE.URL}"]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.cert.public_key_algorithm
        error_handler: CUSTOM_ERROR
        error_handler_params: 'No cert data: web_check.py cert returned error envelope (see master item JSON).'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: scope
        value: tls
      triggers:
      - uuid: 54d783db538348f6bf3910fc78891bdf
        expression: "(last(/Web service by itforprof.com - Certificate-TLS/web_check.cert.public_key_algorithm)=\"rsa\" and\n\
          \ last(/Web service by itforprof.com - Certificate-TLS/web_check.cert.public_key_bits)<{$WEB_SERVICE.CERT.MIN_KEY_RSA})\
          \ or\n(last(/Web service by itforprof.com - Certificate-TLS/web_check.cert.public_key_algorithm)=\"ecdsa\" and\n\
          \ last(/Web service by itforprof.com - Certificate-TLS/web_check.cert.public_key_bits)<{$WEB_SERVICE.CERT.MIN_KEY_ECDSA})\n"
        name: Cert weak public key
        event_name: 'TLS cert weak key: {ITEM.VALUE1} {ITEM.VALUE2} bits — {$WEB_SERVICE.URL} on {HOST.HOST}'
        priority: WARNING
        manual_close: 'YES'
        description: Certificate public key is shorter than the configured minimum for its algorithm.
        tags:
        - tag: scope
          value: tls
        - tag: url
          value: '{$WEB_SERVICE.URL}'
        dependencies:
        - name: Cert check failing
          expression: last(/Web service by itforprof.com - Certificate-TLS/web_check.cert.ok)=0
    - uuid: 5e407290d7c94bff88372c3c71b8bcf8
      name: 'Cert: public key bits'
      type: DEPENDENT
      key: web_check.cert.public_key_bits
      value_type: UNSIGNED
      master_item:
        key: web_check.py["cert","{$WEB_SERVICE.URL}"]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.cert.public_key_bits
        error_handler: CUSTOM_ERROR
        error_handler_params: 'No cert data: web_check.py cert returned error envelope (see master item JSON).'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: scope
        value: tls
    - uuid: 4d8259b528a14f2db3d5f9b2b75e35d3
      name: 'Cert: hostname covered'
      type: DEPENDENT
      key: web_check.cert.hostname_covered
      value_type: UNSIGNED
      master_item:
        key: web_check.py["cert","{$WEB_SERVICE.URL}"]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.cert.hostname_covered
        error_handler: CUSTOM_ERROR
        error_handler_params: 'No cert data: web_check.py cert returned error envelope (see master item JSON).'
      - type: BOOL_TO_DECIMAL
        parameters:
        - ''
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      valuemap:
        name: 'web_check: boolean'
      tags:
      - tag: scope
        value: tls
      triggers:
      - uuid: c5b8e99c4ce14c20b70cbd7dfda58105
        expression: last(/Web service by itforprof.com - Certificate-TLS/web_check.cert.hostname_covered)=0
        name: Cert hostname not covered
        priority: HIGH
        manual_close: 'YES'
        description: The current certificate has no SAN/CN that matches the host being monitored.
        tags:
        - tag: scope
          value: tls
        - tag: url
          value: '{$WEB_SERVICE.URL}'
        dependencies:
        - name: Cert check failing
          expression: last(/Web service by itforprof.com - Certificate-TLS/web_check.cert.ok)=0
        event_name: TLS cert SAN/CN does not cover {$WEB_SERVICE.URL} on {HOST.HOST}
    - uuid: dbcb3ff0d1f941ea8e174bb838115f60
      name: 'Cert: chain status'
      type: DEPENDENT
      key: web_check.cert.chain_status
      value_type: CHAR
      master_item:
        key: web_check.py["cert","{$WEB_SERVICE.URL}"]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.cert.chain_status
        error_handler: CUSTOM_ERROR
        error_handler_params: 'No cert data: web_check.py cert returned error envelope (see master item JSON).'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      tags:
      - tag: scope
        value: tls
      triggers:
      - uuid: fd78479535fd42b08f26778030beeec8
        expression: last(/Web service by itforprof.com - Certificate-TLS/web_check.cert.chain_status)="untrusted"
        name: Cert chain untrusted
        event_name: TLS cert chain {ITEM.VALUE1} — {$WEB_SERVICE.URL} on {HOST.HOST}
        priority: HIGH
        manual_close: 'YES'
        description: 'TLS chain validation failed.

          For internal/self-hosted services signed by a corporate CA, install the corporate root/intermediate CA certificates
          into the trust store on the Zabbix server/proxy that monitors this host, then restart/retry the web_check.py cert
          check. Also verify the web server sends the leaf plus any required intermediate certificates.'
        tags:
        - tag: scope
          value: tls
        - tag: url
          value: '{$WEB_SERVICE.URL}'
        dependencies:
        - name: Cert check failing
          expression: last(/Web service by itforprof.com - Certificate-TLS/web_check.cert.ok)=0
    - uuid: c7b6ab211c5c44ee949a191e5d71f244
      name: 'Cert: check ok'
      type: DEPENDENT
      key: web_check.cert.ok
      value_type: UNSIGNED
      master_item:
        key: web_check.py["cert","{$WEB_SERVICE.URL}"]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.ok
        error_handler: CUSTOM_ERROR
        error_handler_params: 'No cert data: web_check.py cert returned error envelope (see master item JSON).'
