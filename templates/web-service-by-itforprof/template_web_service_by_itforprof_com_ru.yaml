    - uuid: 117107c9c4c0479aa9825347cea751b9
      name: 'Диагностика: время соединения TCP 443'
      type: SIMPLE
      key: net.tcp.service.perf[https,{$WEB_SERVICE.HOST},443]
      delay: '{$WEB_SERVICE.DIAG.CHECK.INTERVAL}'
      value_type: FLOAT
      units: s
      tags:
      - tag: scope
        value: diag
      triggers:
      - uuid: fd0ada034a644ca3bf0086101c92395a
        expression: last(/Web service by itforprof.com/net.tcp.service.perf[https,{$WEB_SERVICE.HOST},443])=0
        name: Нет соединения TCP 443
        priority: HIGH
        description: Соединение TCP/443 с хостом отклонено, или хост недоступен.
        tags:
        - tag: scope
          value: diag
        - tag: url
          value: '{$WEB_SERVICE.URL}'
        event_name: Нет соединения TCP/443 с {$WEB_SERVICE.HOST} — {HOST.NAME} ({HOST.HOST})
        manual_close: 'YES'
      - uuid: ff15f34c63b247c8a7334a465c45bd73
        expression: avg(/Web service by itforprof.com/net.tcp.service.perf[https,{$WEB_SERVICE.HOST},443],30m)>{$WEB_SERVICE.TCP.SLOW_SEC}
        name: Медленное соединение TCP 443
        priority: WARNING
        description: 'Среднее время соединения TCP/443 за 30 мин выше {$WEB_SERVICE.TCP.SLOW_SEC} с. Берётся среднее, поэтому разовые сетевые скачки не будят дежурного: срабатывает только устойчивое замедление. На хостах за CDN с намеренно далёкими точками присутствия поднимите порог макросом.'
        dependencies:
        - name: Нет соединения TCP 443
          expression: last(/Web service by itforprof.com/net.tcp.service.perf[https,{$WEB_SERVICE.HOST},443])=0
        tags:
        - tag: scope
          value: diag
        - tag: url
          value: '{$WEB_SERVICE.URL}'
        event_name: 'Медленное соединение TCP/443 с {$WEB_SERVICE.HOST}: в среднем {ITEM.LASTVALUE1} за 30 мин (порог {$WEB_SERVICE.TCP.SLOW_SEC} с) — {HOST.NAME} ({HOST.HOST})'
        manual_close: 'YES'
    - uuid: ccec84b433b442b7a9a94f9f409248c3
      name: 'Диагностика: время соединения TCP 80'
      type: SIMPLE
      key: net.tcp.service.perf[http,{$WEB_SERVICE.HOST},80]
      delay: '{$WEB_SERVICE.DIAG.CHECK.INTERVAL}'
      value_type: FLOAT
      units: s
      tags:
      - tag: scope
