    - uuid: 8ec55f72623544019b7b162928286550
      name: 'Скан TLS: матрица (основной JSON)'
      type: EXTERNAL
      key: web_check.py["tls-scan","{$WEB_SERVICE.URL}"]
      delay: '{$WEB_SERVICE.TLS_SCAN.CHECK.INTERVAL}'
      history: 30d
      trends: '0'
      value_type: TEXT
      description: |
        Раз в сутки запускает `web_check.py tls-scan <url>`. Возвращает в JSON
        поддерживаемые протоколы TLS и найденные слабые шифры. Правило LLD
        ниже создаёт прототип элемента и прототип триггера на каждую
        находку (устаревший протокол или слабый шифр).
      tags:
      - tag: scope
        value: tls-scan
      - tag: layer
        value: '5'
      triggers:
      - uuid: f83607e740cb4fea8a7690ac784e8d63
        expression: nodata(/Web service by itforprof.com/web_check.py["tls-scan","{$WEB_SERVICE.URL}"],3d)=1
        name: Нет данных внешнего скрипта скана TLS
        event_name: 'web_check.py tls-scan: нет свежего значения 3 дня — {$WEB_SERVICE.URL} на {HOST.HOST}'
        opdata: нет значения 3 дня — элемент не поддерживается, отключён или скрипт не запускается
        priority: INFO
        manual_close: 'YES'
        description: |
          Основной элемент скана TLS не получал свежего значения 3 дня
          (втрое дольше интервала по умолчанию, 1 сутки). Причины по убыванию вероятности:
          - элемент не поддерживается — сначала прочитайте его ошибку (например,
            Invalid update interval "{$WEB_SERVICE.TLS_SCAN.CHECK.INTERVAL}": так бывает,
            когда шаблон отвязали от хоста и его макросы пропали);
          - элемент отключён;
          - web_check.py не запускается там, где мониторится хост.
        tags:
        - tag: scope
          value: data-collection
        - tag: url
          value: '{$WEB_SERVICE.URL}'
      - uuid: 8ffbb997f39544f784a20a091ece0d28
        expression: count(/Web service by itforprof.com/web_check.py["tls-scan","{$WEB_SERVICE.URL}"],#2,"like","tls_scan_timeout")=2
        name: Скан TLS не укладывается в лимит времени
        event_name: 'web_check.py tls-scan: нет результата за 25 с два запуска подряд — {$WEB_SERVICE.URL} на {HOST.HOST}'
        priority: INFO
        manual_close: 'YES'
        description: |
          Два последних ежедневных скана TLS вернули error_code=tls_scan_timeout.
          Сервер отвечает слишком медленно, и пробы протоколов и слабых шифров
          не успевают за 25 с (Zabbix останавливает внешние проверки на 30 с).
          Поддерживаемые протоколы и находки по слабым шифрам пока не обновляются,
          правило LLD сохраняет уже найденное. Триггер молчит, пока не проходит
          соединение TCP 443: о недоступной цели уже сообщает другой триггер.
        tags:
        - tag: scope
          value: tls-scan
        - tag: url
          value: '{$WEB_SERVICE.URL}'
        dependencies:
        - name: Нет соединения TCP 443
          expression: last(/Web service by itforprof.com/net.tcp.service.perf[https,{$WEB_SERVICE.HOST},443])=0
    - uuid: 4ff2ca946d4844e9a030b157dc5e16c7
      name: 'Скан TLS: поддерживаемые протоколы'
      type: DEPENDENT
      key: web_check.tls_scan.supported_protocols
      value_type: TEXT
      master_item:
        key: web_check.py["tls-scan","{$WEB_SERVICE.URL}"]
      preprocessing:
      - type: NOT_MATCHES_REGEX
        parameters:
        - '"ok":false'
        error_handler: CUSTOM_ERROR
        error_handler_params: 'No tls-scan data: web_check.py tls-scan returned error envelope (see master item JSON).'
      - type: JSONPATH
        parameters:
        - $.supported_protocols
        error_handler: CUSTOM_ERROR
        error_handler_params: 'No tls-scan data: web_check.py tls-scan returned error envelope (see master item JSON).'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 7d
      tags:
      - tag: scope
        value: tls-scan
    - uuid: cea730238f714db4af859aa39aca1a60
      name: 'Скан TLS: число слабых находок'
      type: DEPENDENT
      key: web_check.tls_scan.weak_count
      value_type: UNSIGNED
      master_item:
        key: web_check.py["tls-scan","{$WEB_SERVICE.URL}"]
      preprocessing:
      - type: NOT_MATCHES_REGEX
        parameters:
        - '"ok":false'
        error_handler: CUSTOM_ERROR
        error_handler_params: 'No tls-scan data: web_check.py tls-scan returned error envelope (see master item JSON).'
      - type: JSONPATH
        parameters:
        - $.weak_count
        error_handler: CUSTOM_ERROR
        error_handler_params: 'No tls-scan data: web_check.py tls-scan returned error envelope (see master item JSON).'
      tags:
      - tag: scope
        value: tls-scan
    - uuid: 4a9c1b0e8b2d4f1c8e3a7b6c5d4e3f21
      name: 'HTTP/3: проверка (основной JSON)'
      type: EXTERNAL
      key: web_check.py["http3","{$WEB_SERVICE.URL}"]
      delay: '{$WEB_SERVICE.HTTP3.CHECK.INTERVAL}'
      history: 14d
      trends: '0'
      value_type: TEXT
      description: |-
        Запускает `web_check.py http3 <url>` там, где мониторится хост.
        Проверка идёт в два шага. Запрос HEAD читает Alt-Svc; если h3 объявлен,
        выполняется рукопожатие QUIC (ALPN=h3) на UDP-порт. Возвращает
        alt_svc_advertised, h3_reachable, handshake_ms, alpn, quic_version.
        На хостах, которые не объявляют h3, триггеры не срабатывают.
      tags:
      - tag: scope
        value: http3
      - tag: layer
        value: '6'
      triggers:
      - uuid: 4df09b7121514ffc853a17a40a13ba32
        expression: min(/Web service by itforprof.com/web_check.http3.alt_svc_advertised,#3)=1 and max(/Web service by itforprof.com/web_check.http3.reachable,#3)=0
        name: HTTP/3 объявлен, но недоступен
        event_name: 'HTTP/3 объявлен, но недоступен: {$WEB_SERVICE.URL} на {HOST.HOST}'
        priority: AVERAGE
        manual_close: 'YES'
        description: |-
          Сервер объявляет HTTP/3 в заголовке Alt-Svc, но рукопожатие QUIC
          с этого прокси не прошло на трёх проверках подряд (около 10–15 мин).
          Сайт продолжает отвечать по HTTP/2. Причины: UDP/443 режется по пути,
          стек QUIC на сервере настроен неверно или регрессия CDN. Проверки,
          упавшие на DNS (error_code=dns_error), не учитываются. Сверьтесь
          с диагностическими элементами сети.
        tags:
        - tag: scope
          value: http3
        - tag: url
          value: '{$WEB_SERVICE.URL}'
        dependencies:
        - name: Проверка HTTP/3 не работает
          expression: last(/Web service by itforprof.com/web_check.http3.ok)=0
      - uuid: 4cc0745f57df4d9788d521f5006b444c
        expression: avg(/Web service by itforprof.com/web_check.http3.handshake_ms,1h)>{$WEB_SERVICE.HTTP3.SLOW_MS} and avg(/Web service by itforprof.com/web_check.http3.handshake_ms,1h)>0
        name: Медленное рукопожатие HTTP/3
        event_name: 'Медленное рукопожатие HTTP/3 с {$WEB_SERVICE.URL}: в среднем {ITEM.LASTVALUE1} за 1 ч (порог {$WEB_SERVICE.HTTP3.SLOW_MS} мс) — {HOST.NAME} ({HOST.HOST})'
        priority: WARNING
        manual_close: 'YES'
        description: Среднее время рукопожатия QUIC за 1 ч выше {$WEB_SERVICE.HTTP3.SLOW_MS} мс. Основной элемент http3 опрашивает раз в 5 мин, поэтому за час набирается устойчивая выборка.
        tags:
        - tag: scope
          value: http3
        - tag: url
          value: '{$WEB_SERVICE.URL}'
        dependencies:
        - name: HTTP/3 объявлен, но недоступен
          expression: min(/Web service by itforprof.com/web_check.http3.alt_svc_advertised,#3)=1 and max(/Web service by itforprof.com/web_check.http3.reachable,#3)=0
      - uuid: 1b8861a5003f4f2082c745335694954a
        expression: last(/Web service by itforprof.com/web_check.http3.ok)=0
        name: Проверка HTTP/3 не работает
        event_name: web_check.py http3 вернул ok=false — {$WEB_SERVICE.URL} на {HOST.HOST}
        priority: INFO
        description: Сбой самого внешнего скрипта http3 (неверный URL и т. п.). Подробности — в основном элементе.
        tags:
        - tag: scope
          value: http3
        - tag: url
          value: '{$WEB_SERVICE.URL}'
        dependencies:
        - name: Нет данных внешнего скрипта HTTP/3
          expression: nodata(/Web service by itforprof.com/web_check.py["http3","{$WEB_SERVICE.URL}"],15m)=1
        manual_close: 'YES'
      - uuid: 5b621e14f97041a1bee7eb7502b88080
        expression: nodata(/Web service by itforprof.com/web_check.py["http3","{$WEB_SERVICE.URL}"],15m)=1
        name: Нет данных внешнего скрипта HTTP/3
        event_name: 'web_check.py http3: нет свежего значения 15 мин — {$WEB_SERVICE.URL} на {HOST.HOST}'
        opdata: нет значения 15 мин — элемент не поддерживается, отключён или скрипт не запускается
        priority: AVERAGE
        manual_close: 'YES'
        description: |
          Основной элемент HTTP/3 не получал свежего значения 15 мин
          (втрое дольше интервала по умолчанию, 5 мин). Причины по убыванию вероятности:
          - элемент не поддерживается — сначала прочитайте его ошибку (например,
            Invalid update interval "{$WEB_SERVICE.HTTP3.CHECK.INTERVAL}": так бывает,
            когда шаблон отвязали от хоста и его макросы пропали);
          - элемент отключён;
          - web_check.py не запускается там, где мониторится хост.
        tags:
        - tag: scope
          value: data-collection
        - tag: url
          value: '{$WEB_SERVICE.URL}'
    - uuid: 5b8a2c1f9c3e4012a4b8c7d6e5f43210
      name: 'HTTP/3: Alt-Svc объявляет h3'
      type: DEPENDENT
      key: web_check.http3.alt_svc_advertised
      value_type: UNSIGNED
      master_item:
        key: web_check.py["http3","{$WEB_SERVICE.URL}"]
      preprocessing:
      - type: NOT_MATCHES_REGEX
        parameters:
        - '"error_code":"dns_error"'
        error_handler: DISCARD_VALUE
      - type: JSONPATH
        parameters:
        - $.alt_svc_advertised
        error_handler: CUSTOM_ERROR
        error_handler_params: 'No HTTP/3 data: web_check.py http3 returned error envelope or h3 not advertised.'
      - type: BOOL_TO_DECIMAL
        parameters:
        - ''
      tags:
      - tag: scope
        value: http3
      valuemap:
        name: 'web_check: boolean'
    - uuid: 2477368de1754de89c9613f8925a9794
      name: 'HTTP/3: доступен по QUIC'
      type: DEPENDENT
      key: web_check.http3.reachable
      value_type: UNSIGNED
      master_item:
        key: web_check.py["http3","{$WEB_SERVICE.URL}"]
      preprocessing:
      - type: NOT_MATCHES_REGEX
        parameters:
        - '"error_code":"dns_error"'
        error_handler: DISCARD_VALUE
      - type: JSONPATH
        parameters:
        - $.h3_reachable
        error_handler: CUSTOM_ERROR
        error_handler_params: 'No HTTP/3 data: web_check.py http3 returned error envelope or h3 not advertised.'
      - type: BOOL_TO_DECIMAL
        parameters:
        - ''
      tags:
      - tag: scope
        value: http3
      valuemap:
        name: 'web_check: boolean'
    - uuid: a02d42490189480a81727d4efd940020
      name: 'HTTP/3: время рукопожатия QUIC'
      type: DEPENDENT
      key: web_check.http3.handshake_ms
      value_type: FLOAT
      master_item:
        key: web_check.py["http3","{$WEB_SERVICE.URL}"]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.handshake_ms
        error_handler: CUSTOM_ERROR
        error_handler_params: 'No HTTP/3 data: web_check.py http3 returned error envelope or h3 not advertised.'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      tags:
      - tag: scope
        value: http3
      units: ms
    - uuid: a61ea242e2014d60a5096d039af1c9e5
      name: 'HTTP/3: согласованный ALPN'
      type: DEPENDENT
      key: web_check.http3.alpn
      value_type: CHAR
      master_item:
        key: web_check.py["http3","{$WEB_SERVICE.URL}"]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.alpn
        error_handler: CUSTOM_ERROR
        error_handler_params: 'No HTTP/3 data: web_check.py http3 returned error envelope or h3 not advertised.'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      tags:
      - tag: scope
        value: http3
    - uuid: e7455b43380349f5b027229387d77205
      name: 'HTTP/3: версия QUIC'
      type: DEPENDENT
      key: web_check.http3.quic_version
      value_type: CHAR
      master_item:
        key: web_check.py["http3","{$WEB_SERVICE.URL}"]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.quic_version
        error_handler: CUSTOM_ERROR
        error_handler_params: 'No HTTP/3 data: web_check.py http3 returned error envelope or h3 not advertised.'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      tags:
      - tag: scope
        value: http3
    - uuid: 6b2ee44044be4b389279b971b069a680
      name: 'HTTP/3: проверка успешна'
      type: DEPENDENT
      key: web_check.http3.ok
      value_type: UNSIGNED
      master_item:
        key: web_check.py["http3","{$WEB_SERVICE.URL}"]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.ok
        error_handler: CUSTOM_ERROR
        error_handler_params: 'No HTTP/3 data: web_check.py http3 returned error envelope or h3 not advertised.'
      - type: BOOL_TO_DECIMAL
        parameters:
        - ''
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 10m
      tags:
      - tag: scope
        value: http3
      valuemap:
        name: 'web_check: boolean'
    discovery_rules:
    - uuid: 9cfbb8fb495b48d79c267e58b9e1bc2a
      name: Обнаружение находок TLS
      type: EXTERNAL
      key: web_check.py["discover-tls","{$WEB_SERVICE.URL}"]
      delay: '{$WEB_SERVICE.TLS_SCAN.CHECK.INTERVAL}'
      description: |
        Создаёт по записи LLD на каждый слабый протокол или шифр из tls-scan.
        Макросы: {#TLS_FINDING}, {#TLS_FINDING.CATEGORY}, {#TLS_FINDING.SEVERITY}.
      lifetime: 7d
      item_prototypes:
      - uuid: bfa90adeee7345cda61815a8e3cb4b62
        name: 'Находка скана TLS: {#TLS_FINDING}'
        type: DEPENDENT
        key: web_check.tls_scan.finding[{#TLS_FINDING}]
        value_type: CHAR
        master_item:
          key: web_check.py["tls-scan","{$WEB_SERVICE.URL}"]
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.weak_findings[?(@.name == "{#TLS_FINDING}")].severity.first()
          error_handler: CUSTOM_ERROR
          error_handler_params: 'No tls-scan data: web_check.py tls-scan returned error envelope (see master item JSON).'
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 7d
        tags:
        - tag: scope
          value: tls-scan
        - tag: tls.finding
          value: '{#TLS_FINDING}'
        - tag: tls.category
          value: '{#TLS_FINDING.CATEGORY}'
        trigger_prototypes:
        - uuid: 232029b8b19f431896d533781cda191b
          expression: length(last(/Web service by itforprof.com/web_check.tls_scan.finding[{#TLS_FINDING}]))>0
          name: 'Слабый TLS ({#TLS_FINDING.CATEGORY}): {#TLS_FINDING}'
          event_name: 'Сервер допускает слабый TLS ({#TLS_FINDING.CATEGORY}): {#TLS_FINDING} на {$WEB_SERVICE.URL} ({HOST.HOST})'
          priority: WARNING
          description: |
            Ежедневный скан TLS согласовал устаревший протокол или слабое
            семейство шифров. Проверьте настройки TLS на сервере.
          tags:
          - tag: scope
            value: tls-scan
          - tag: tls.finding
            value: '{#TLS_FINDING}'
          - tag: url
            value: '{$WEB_SERVICE.URL}'
          dependencies:
          - name: Нет данных внешнего скрипта скана TLS
            expression: nodata(/Web service by itforprof.com/web_check.py["tls-scan","{$WEB_SERVICE.URL}"],3d)=1
    valuemaps:
    - uuid: 09b3d107743842c3b05d7beccbb7b5be
      name: 'web_check: boolean'
      mappings:
      - value: '0'
        newvalue: нет
      - value: '1'
        newvalue: да
