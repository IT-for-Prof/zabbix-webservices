# Do not edit: change the English template or the catalog and rerun the script.
zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: bd327ca2dab24c4aa6ba757655aa052f
    name: Templates/Applications
  templates:
  - uuid: 42159b48c68348b89c1ddea1fe82b57e
    template: Web service by itforprof.com
    name: Веб-сервис (itforprof.com)
    description: |
      Шаблон Zabbix 7.0 для полного мониторинга веб-сервиса.
      Заменяет устаревший «Template Website metrics (itmicus.ru)» и работает
      без заброшенных пакетов PyPI. Шесть слоёв на одном хосте и в одном шаблоне:

        1. Доступность HTTP    — встроенный веб-сценарий.
        2. TLS и сертификат    — внешний скрипт `web_check.py cert`.
        3. WHOIS домена        — внешний скрипт `web_check.py whois`
                                 (один запрос на регистрируемый домен, кеш на диске 24 ч).
        4. Сетевая диагностика — встроенные простые проверки (TCP).
        5. Глубокий скан TLS   — внешний скрипт `web_check.py tls-scan`
                                 и LLD по слабым протоколам и шифрам.
        6. Доступность HTTP/3  — внешний скрипт `web_check.py http3`
                                 (заголовок Alt-Svc и рукопожатие QUIC через aioquic).

      Все проверки выполняются там, где мониторится хост (сервер или прокси),
      поэтому запросы идут с того же адреса, что и остальной мониторинг хоста.

      Обоснование решений и полная классификация: docs/architecture.md.
      Матрица проверок:                            docs/validation.md.

      Автор:        Константин Тютюнник / Konstantin Tyutyunnik
      Сайт:         https://itforprof.com
      Репозиторий:  https://github.com/IT-for-Prof/zabbix-webservices
      Ошибки:       https://github.com/IT-for-Prof/zabbix-webservices/issues
      Предшественник: похожий по задаче шаблон Zabbix
                    `Template Website metrics (itmicus.ru)` от itmicus —
                    https://github.com/itmicus/zabbix/tree/master/Template%20Web%20Site.
                    Код не копировался; имена макросов совместимы
                    с макросами существующих хостов.
      Лицензия:     MIT (c) 2025-2026 Konstantin Tyutyunnik
    vendor:
      name: itforprof.com
      version: 7.0-2.3.4
    groups:
    - name: Templates/Applications
    macros:
    - macro: '{$WEB_SERVICE.URL}'
      description: Полный URL для проверки, например https://example.com/healthz. Обязательный.
    - macro: '{$WEB_SERVICE.PHRASE}'
      description: 'Подстрока или регулярное выражение, которые должны быть в теле ответа. Необязательный: пустое значение отключает проверку фразы.'
    - macro: '{$WEB_SERVICE.PHRASE.FLAGS}'
      value: (?i)
      description: Префикс флагов PCRE для {$WEB_SERVICE.PHRASE}. По умолчанию «(?i)» — без учёта регистра. Пустое значение — с учётом регистра, «(?s)» — точка совпадает и с переводом строки.
    - macro: '{$WEB_SERVICE.TIMEOUT}'
      value: '15'
      description: Таймаут HTTP-запроса в секундах.
    - macro: '{$WEB_SERVICE.EXPECTED_CODE}'
      value: '200'
      description: Коды ответа HTTP, которые считаются нормальными. Через запятую, можно указывать диапазоны, например «200,204,301-302».
    - macro: '{$WEB_SERVICE.USER_AGENT}'
      value: Zabbix-WebService-by-itforprof/2.0
      description: Заголовок User-Agent для веб-сценария.
    - macro: '{$WEB_SERVICE.CHECK.INTERVAL}'
      value: 1m
      description: Интервал запуска веб-сценария.
    - macro: '{$WEB_SERVICE.CERT.CHECK.INTERVAL}'
      value: 5m
      description: Интервал основного элемента проверки сертификата.
    - macro: '{$WEB_SERVICE.WHOIS.CHECK.INTERVAL}'
      value: 1h
      description: Интервал основного элемента WHOIS (обычно ответ берётся из кеша).
    - macro: '{$WEB_SERVICE.WHOIS.CACHE.TTL}'
      value: '86400'
      description: Время жизни кеша WHOIS в секундах (передаётся в web_check.py whois --ttl).
    - macro: '{$WEB_SERVICE.TLS_SCAN.CHECK.INTERVAL}'
      value: 1d
      description: Интервал глубокого скана TLS.
    - macro: '{$WEB_SERVICE.HTTP3.CHECK.INTERVAL}'
      value: 5m
      description: Интервал основного элемента HTTP/3.
    - macro: '{$WEB_SERVICE.HTTP3.SLOW_MS}'
      value: '1000'
      description: Порог предупреждения для рукопожатия QUIC в миллисекундах. 1000 мс по умолчанию учитывают межконтинентальные задержки. Для локальной сети — 250.
    - macro: '{$WEB_SERVICE.DIAG.CHECK.INTERVAL}'
      value: 5m
      description: Интервал диагностических простых проверок.
    - macro: '{$WEB_SERVICE.SLOW.WARN}'
      value: '10'
      description: Среднее время ответа HTTP за 10 мин в секундах, выше которого срабатывает предупреждение. 10 с по умолчанию учитывают межконтинентальные задержки, для региональных сайтов — 5.
    - macro: '{$WEB_SERVICE.NODATA.PERIOD}'
      value: 10m
      description: Сколько времени веб-сценарий может не присылать данных, прежде чем сработает триггер «нет данных».
    - macro: '{$WEB_SERVICE.CERT.WARN_DAYS}'
      value: '30'
      description: Порог триггера уровня «Информация» по сроку сертификата, дни.
    - macro: '{$WEB_SERVICE.CERT.NOTICE_DAYS}'
      value: '14'
      description: Порог триггера уровня «Предупреждение» по сроку сертификата, дни.
    - macro: '{$WEB_SERVICE.CERT.CRIT_DAYS}'
      value: '7'
      description: Порог триггера уровня «Высокая» по сроку сертификата, дни.
    - macro: '{$WEB_SERVICE.CERT.ROTATE_MIN_DAYS}'
      value: '3'
      description: 'Порог поздней замены сертификата, дни. Если сертификат заменён (сменился отпечаток), а у прежнего оставалось меньше этого числа дней, срабатывает предупреждение «сертификат заменён поздно». Это сигнал о малом запасе. Аварии нет: к моменту срабатывания новый сертификат уже установлен. Триггер смотрит на окно до замены (максимум за 2 ч, закончившиеся 15 мин назад) и не видит новый сертификат. Значение 3 по умолчанию не шумит на хостах, где продлением управляет провайдер. Увеличьте его там, где автоматизация продления ваша, чтобы узнавать раньше.'
    - macro: '{$WEB_SERVICE.CERT.MIN_KEY_RSA}'
      value: '2048'
      description: Минимальная длина ключа RSA, бит.
    - macro: '{$WEB_SERVICE.CERT.MIN_KEY_ECDSA}'
      value: '256'
      description: Минимальная длина ключа ECDSA, бит.
    - macro: '{$WEB_SERVICE.WHOIS.WARN_DAYS}'
      value: '30'
      description: 'Порог триггера уровня «Предупреждение»: домен истекает через N дней.'
    - macro: '{$WEB_SERVICE.WHOIS.NOTICE_DAYS}'
      value: '7'
      description: 'Порог триггера уровня «Средняя»: домен истекает через N дней.'
    - macro: '{$WEB_SERVICE.WHOIS.CRIT_DAYS}'
      value: '1'
      description: 'Порог триггера уровня «Высокая»: домен истекает через N дней.'
    - macro: '{$WEB_SERVICE.HOST}'
      description: Хост или IP для диагностических простых проверок (net.dns.record, net.tcp.service.perf). По умолчанию — хост из {$WEB_SERVICE.URL}, при необходимости переопределяется на хосте.
    - macro: '{$WEB_SERVICE.TCP.SLOW_SEC}'
      value: '3'
      description: Порог предупреждения для net.tcp.service.perf в секундах. 3 с по умолчанию покрывают межконтинентальное соединение TCP и TLS (обычно 300–800 мс) с запасом. Для локальной сети и проверок внутри региона — 1.
    tags:
    - tag: class
      value: web-service
    httptests:
    - uuid: f41f42e32d1e4deca035b04fae2d3281
      name: Web service
      delay: '{$WEB_SERVICE.CHECK.INTERVAL}'
      agent: '{$WEB_SERVICE.USER_AGENT}'
      steps:
      - name: GET
        url: '{$WEB_SERVICE.URL}'
        timeout: '{$WEB_SERVICE.TIMEOUT}'
        status_codes: '{$WEB_SERVICE.EXPECTED_CODE}'
        required: '{$WEB_SERVICE.PHRASE.FLAGS}{$WEB_SERVICE.PHRASE}'
        follow_redirects: 'YES'
        retrieve_mode: BODY
      tags:
      - tag: scope
        value: availability
    items:
    - uuid: e2bf4e622bc04bfdab7d9283c478663b
      name: 'Сертификат: проверка (основной JSON)'
      type: EXTERNAL
      key: web_check.py["cert","{$WEB_SERVICE.URL}"]
      delay: '{$WEB_SERVICE.CERT.CHECK.INTERVAL}'
      history: 7d
      trends: '0'
      value_type: TEXT
      description: |
        Запускает `web_check.py cert <url>` там, где мониторится хост.
        Результат — объект JSON, из которого читают зависимые элементы ниже
        (subject, issuer, SAN, отпечаток, дни до истечения, chain_status и т. д.).
        Код выхода всегда 0, ошибка кодируется как {"ok": false, "error_code": ...}.
      tags:
      - tag: scope
        value: tls
      - tag: layer
        value: '2'
      triggers:
      - uuid: be5d249ccc8a4058ab24198c61ec5eec
        expression: last(/Web service by itforprof.com/web.test.fail[Web service])<>0
        name: Сбой веб-сервиса
        event_name: 'Сбой веб-сервиса: {$WEB_SERVICE.URL} — {HOST.NAME} ({HOST.HOST}) — HTTP {?last(//web.test.rspcode[Web service,GET])} / {?last(//web.test.error[Web service])}'
        opdata: 'шаг с ошибкой: {ITEM.LASTVALUE1}'
        priority: HIGH
        manual_close: 'YES'
        description: |
          Шаг веб-сценария завершился с ошибкой. Сюда входят все жёсткие сбои:
          неожиданный код HTTP, нет нужной фразы, таймаут,
          ошибка DNS, сбой TLS-рукопожатия или отказ в соединении.
        tags:
        - tag: scope
          value: availability
        - tag: url
          value: '{$WEB_SERVICE.URL}'
        dependencies:
        - name: Нет данных веб-сервиса
          expression: nodata(/Web service by itforprof.com/web.test.fail[Web service],{$WEB_SERVICE.NODATA.PERIOD})=1
      - uuid: ab9b1814328d4275b1c568d64f213acc
        expression: avg(/Web service by itforprof.com/web.test.time[Web service,GET,resp],10m)>{$WEB_SERVICE.SLOW.WARN}
        name: Веб-сервис отвечает медленно
        event_name: 'Веб-сервис отвечает медленно: в среднем {ITEM.LASTVALUE1} за 10 мин (порог {$WEB_SERVICE.SLOW.WARN} с) — {$WEB_SERVICE.URL} на {HOST.NAME} ({HOST.HOST})'
        opdata: 'среднее за 10 мин: {ITEM.LASTVALUE1} с'
        priority: WARNING
        manual_close: 'YES'
        description: |
          Среднее время ответа за последние 10 минут выше порога
          {$WEB_SERVICE.SLOW.WARN}.
        dependencies:
        - name: Сбой веб-сервиса
          expression: last(/Web service by itforprof.com/web.test.fail[Web service])<>0
        tags:
        - tag: scope
          value: performance
        - tag: url
          value: '{$WEB_SERVICE.URL}'
      - uuid: ab645603a19146d1b7eb21c8d7b8d9a8
        expression: nodata(/Web service by itforprof.com/web.test.fail[Web service],{$WEB_SERVICE.NODATA.PERIOD})=1
        name: Нет данных веб-сервиса
        event_name: 'Веб-сервис: нет данных {$WEB_SERVICE.NODATA.PERIOD} — {$WEB_SERVICE.URL} на {HOST.HOST}'
        opdata: нет свежих данных веб-сценария
        priority: AVERAGE
        manual_close: 'YES'
        description: Элемент веб-сценария не получал свежих данных дольше заданного периода.
        tags:
        - tag: scope
          value: data-collection
        - tag: url
          value: '{$WEB_SERVICE.URL}'
      - uuid: 2c7f847016824c66bb27c2198d39c5a6
        expression: nodata(/Web service by itforprof.com/web_check.py["cert","{$WEB_SERVICE.URL}"],15m)=1
        name: Нет данных внешнего скрипта сертификата
        event_name: 'web_check.py cert: нет свежего значения 15 мин — {$WEB_SERVICE.URL} на {HOST.HOST}'
        opdata: нет значения 15 мин — элемент не поддерживается, отключён или скрипт не запускается
        priority: AVERAGE
        manual_close: 'YES'
        description: |
          Основной элемент сертификата не получал свежего значения 15 мин
          (втрое дольше интервала по умолчанию). Причины по убыванию вероятности:
          - элемент не поддерживается — сначала прочитайте его ошибку (например,
            Invalid update interval "{$WEB_SERVICE.CERT.CHECK.INTERVAL}": так бывает,
            когда шаблон отвязали от хоста и его макросы пропали);
          - элемент отключён;
          - web_check.py не запускается: проверьте, что
            /usr/lib/zabbix/externalscripts/web_check.py есть и исполняемый
            там, где мониторится хост, и что venv в /opt/web_check/venv
            в порядке.
        tags:
        - tag: scope
          value: data-collection
        - tag: url
          value: '{$WEB_SERVICE.URL}'
